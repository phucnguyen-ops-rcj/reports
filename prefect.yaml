---
# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: reports
prefect-version: 3.6.27

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project
# is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning
# this project in remote locations
pull:
- prefect.deployments.steps.set_working_directory:
    directory: /Users/nguyentienphuc/rcj/reports

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: daily-morning
  version: null
  tags: []
  concurrency_limit: null
  description: null
  entrypoint: src/flows/daily.py:daily_flow
  parameters: {}
  work_pool:
    name: daily-morning
    work_queue_name: null
    job_variables: {}
  schedules:
  - cron: 30 9 * * *
    timezone: "Asia/Singapore"
    day_or: true
- name: daily-market
  entrypoint: src/flows/market.py:market_flow
  work_pool:
    name: daily-morning
- name: daily-net-pnl
  entrypoint: src/flows/net_pnl.py:net_pnl_flow
  work_pool:
    name: daily-morning
- name: daily-trading-volume
  entrypoint: src/flows/trading_volume.py:trading_volume_flow
  work_pool:
    name: daily-morning
- name: volatility-start-model
  tags:
  - ops
  - volatility
  - manual
  description: Start the volatility model for a symbol after the token is live.
  entrypoint: src/flows/ops.py:volatility_model_flow
  parameters:
    symbol: KAIO
    market: spot
    exchange: kucoin
    exchange_data: kucoin
    risk_tol: low
    strategy: slow_mm
    # execution_mode: ssh
    # ssh_host: T1_newuser1
  work_pool:
    name: strategies
  schedules: []
- name: volume-fills
  tags:
  - ops
  - volume
  - manual
  description: Show volume strategy fill/status output in the Prefect UI.
  entrypoint: src/flows/ops.py:volume_strategy_fills_flow
  parameters:
    symbol: KAIO
    date: ""
    quote_ccy: USDT
    box: ""
    # execution_mode: ssh
    # ssh_host: T1_newuser1
  work_pool:
    name: strategies
  schedules: []
- name: volume-start-strategy
  tags:
  - ops
  - volume
  - manual
  description: Start the volume strategy for a symbol.
  entrypoint: src/flows/ops.py:start_volume_strategy_flow
  parameters:
    symbol: KAIO
    quote_ccy: USDT
    box: ""
    # execution_mode: ssh
    # ssh_host: T1_newuser1
  work_pool:
    name: strategies
  schedules: []
- name: stacker-status
  tags:
  - ops
  - stacker
  - manual
  description: Show accepted/rejected stacker order output in the Prefect UI.
  entrypoint: src/flows/ops.py:stacker_status_flow
  parameters:
    symbol: BILL
    date: ""
    quote_ccy: USDT
    box: ""
    # execution_mode: ssh
    # ssh_host: T1_newuser1
  work_pool:
    name: strategies
  schedules: []
- name: stacker-launch
  tags:
  - ops
  - stacker
  - manual
  description: Manually launch stacker for a symbol.
  entrypoint: src/flows/ops.py:stacker_launch_flow
  parameters:
    symbol: BILL
    stacker_level: 1
    quote_ccy: USDT
    box: ""
    # execution_mode: ssh
    # ssh_host: T1_newuser1
  work_pool:
    name: strategies
  schedules: []
- name: stacker-setup-config
  tags:
  - ops
  - stacker
  - manual
  description: Create stacker config. Fill hosts and stacker lists before running.
  entrypoint: src/flows/ops.py:stacker_setup_flow
  parameters:
    symbol: KAIO
    feed_host: 0.0.0.0:41741
    gateway_host: 0.0.0.0:41799
    buy_stackers: |
      [
      {
        price: 0.00194
        original_quantity: 5077.9708
      },
      ]
    sell_stackers: |
      [
      {
        price: 0.95841
        original_quantity: 4780.6481
      },
      ]
    exchanges: kucoin
    quote_ccy: USDT
    market: spot
    tick_size: 0.00001
    quantity_step_size: 0.1
    min_price: 0.00001
    max_price: 1.0
    min_quantity: 10.0
    max_quantity: 100000000000
    extra_payload_json: "{}"
    # execution_mode: ssh
    # ssh_host: T1_newuser1
  work_pool:
    name: strategies
  schedules: []
- name: stacker-update-config
  tags:
  - ops
  - stacker
  - manual
  description: Update stacker config using a JSON object for changed fields.
  entrypoint: src/flows/ops.py:stacker_update_flow
  parameters:
    symbol: BILL
    updates_json: '{"max_price": 10.0}'
    exchanges: kucoin
    quote_ccy: USDT
    # execution_mode: ssh
    # ssh_host: T1_newuser1
  work_pool:
    name: strategies
  schedules: []
- name: mirror-control
  tags:
  - ops
  - mirror
  - manual
  description: Start, stop, or restart gateway/feed/strategy mirror processes.
  entrypoint: src/flows/ops.py:mirror_control_flow
  parameters:
    symbol: BILL
    component: strategy
    method: start
    name_override: ""
    exchange: kucoin
    market: spot
    quote_ccy: USDT
    box: ""
    # execution_mode: ssh
    # ssh_host: T1_newuser1
  work_pool:
    name: strategies
  schedules: []
